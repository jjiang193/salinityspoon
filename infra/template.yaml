AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  NaTrack phases 1-2 - the ingest spine and the live session.
  Spoon -> IoT Core -> rule -> SQS -> ingestBite Lambda -> DynamoDB,
  and from there out to any clinician watching that patient over a WebSocket.
  Follows docs/natrack-system-design.pdf and docs/loadcell/aws-handoff.md;
  the message itself is bite/v2 from docs/telemetry-schema.md.

Parameters:
  DeviceId:
    Type: String
    Default: spoon-01
    Description: Thing name and MQTT client id of the first spoon.
  DefaultPatientId:
    Type: String
    Default: demo-1
    Description: >
      Patient used when a device has no pairing item yet. Demo only -
      POST /v1/devices/{id}/pair writes the real one (phase 3).
  SessionStageName:
    Type: String
    Default: live
    Description: WebSocket API stage. It is in the URL clients connect to.
  BiteRetentionDays:
    Type: Number
    Default: 90
    Description: >
      TTL on bite items. The design archives older bites to S3 via Streams
      (phase 5); until that exists, expiring items are simply deleted.

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 256
    Timeout: 30
    Architectures: [arm64]

Resources:
  # --- Storage ---------------------------------------------------------------
  # Two tables, as the design PDF specifies: telemetry separate from patient
  # medical data, so the ingest path never holds permission on the latter.
  TelemetryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-telemetry"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # Profiles, sodium targets, health logs, clinician assignments.
  # Nothing in phase 1 writes here; it exists so phase 3 has it and so the
  # ingest role can be scoped away from it from the first commit.
  PatientsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-patients"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
        - {AttributeName: GSI1PK, AttributeType: S}
        - {AttributeName: GSI1SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      GlobalSecondaryIndexes:
        # CLINICIAN#<id> -> their patients, for GET /v1/patients?clinicianId=
        - IndexName: GSI1
          KeySchema:
            - {AttributeName: GSI1PK, KeyType: HASH}
            - {AttributeName: GSI1SK, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # --- Buffer ----------------------------------------------------------------
  # The queue absorbs the meal-time spike and gives retries. At-least-once
  # delivery is why the write below is idempotent.
  BiteIngestDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-bite-ingest-dlq"
      MessageRetentionPeriod: 1209600 # 14 days
      SqsManagedSseEnabled: true

  BiteIngestQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-bite-ingest"
      # At least 6x the function timeout, as Lambda's SQS trigger requires.
      VisibilityTimeout: 180
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt BiteIngestDLQ.Arn
        maxReceiveCount: 5

  # --- Ingest ----------------------------------------------------------------
  IngestBiteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ingestBite"
      CodeUri: ingest/
      Handler: app.handler
      Description: Validates bite/v2, resolves the patient, writes it once.
      Environment:
        Variables:
          TELEMETRY_TABLE: !Ref TelemetryTable
          DEFAULT_PATIENT_ID: !Ref DefaultPatientId
          BITE_RETENTION_DAYS: !Ref BiteRetentionDays
          WS_ENDPOINT: !Sub "https://${SessionApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${SessionStageName}"
      Policies:
        # Least privilege on purpose: the telemetry table only, never Patients.
        # Query and DeleteItem are for the live session's connection book.
        - Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:GetItem, dynamodb:Query, dynamodb:DeleteItem]
              Resource: !GetAtt TelemetryTable.Arn
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${SessionApi}/${SessionStageName}/POST/@connections/*" 
      Events:
        Bites:
          Type: SQS
          Properties:
            Queue: !GetAtt BiteIngestQueue.Arn
            BatchSize: 10
            # 0, not 5: the batching window is pure latency on the live view,
            # and a spoon sends one bite every few seconds at most. Batching
            # earns its keep at 10k bites/s, not at one.
            MaximumBatchingWindowInSeconds: 0
            FunctionResponseTypes: [ReportBatchItemFailures]

  # Health data: keep the logs short-lived and never log a payload (see app.py).
  IngestBiteLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-ingestBite"
      RetentionInDays: 14

  # --- Device side -----------------------------------------------------------
  SpoonThing:
    Type: AWS::IoT::Thing
    Properties:
      ThingName: !Ref DeviceId

  # Connect as itself, publish to its own topic. Nothing else.
  SpoonPolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: !Sub "${AWS::StackName}-spoon"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: iot:Connect
            Resource: !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:client/${DeviceId}"
          - Effect: Allow
            Action: iot:Publish
            Resource: !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/devices/${DeviceId}/bites"

  IoTRuleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: iot.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: send-to-bite-queue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt BiteIngestQueue.Arn

  # topic(2) is the deviceId segment of devices/<id>/bites. Selecting it
  # overwrites whatever deviceId the payload claims, so one spoon cannot
  # impersonate another.
  BiteTopicRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub
        - "${Name}_bites"
        - Name: !Join ["_", !Split ["-", !Ref "AWS::StackName"]]
      TopicRulePayload:
        Sql: "SELECT *, topic(2) AS deviceId FROM 'devices/+/bites'"
        AwsIotSqlVersion: "2016-03-23"
        RuleDisabled: false
        Actions:
          - Sqs:
              QueueUrl: !Ref BiteIngestQueue
              RoleArn: !GetAtt IoTRuleRole.Arn
              UseBase64: false

  # --- Live session (phase 2) -------------------------------------------------
  # NaTrack's live view: a clinician opens a socket for one patient and every
  # new bite arrives as it lands. Best effort by design - the table is the
  # source of truth, so a missed push never loses a bite.
  #
  # NaTrack writes this as wss://.../session/{patientId}. A WebSocket API routes
  # on the message body, not the path, so the patient comes in as a query
  # string: wss://<api>/<stage>?patientId=demo-1. Phase 4 can hide that behind
  # a custom domain if the dashboard wants NaTrack's spelling exactly.
  SessionApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-session"
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  SessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-session"
      CodeUri: session/
      Handler: app.handler
      Description: Records who is watching which patient's live session.
      Environment:
        Variables:
          TELEMETRY_TABLE: !Ref TelemetryTable
          CONNECTION_TTL_HOURS: 12
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:GetItem, dynamodb:DeleteItem]
              Resource: !GetAtt TelemetryTable.Arn

  SessionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-session"
      RetentionInDays: 14

  # One integration serves all three routes: the function switches on routeKey.
  SessionIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref SessionApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SessionFunction.Arn}/invocations"

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SessionApi
      RouteKey: $connect
      AuthorizationType: NONE   # Cognito goes here in phase 3
      Target: !Sub "integrations/${SessionIntegration}"

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SessionApi
      RouteKey: $disconnect
      Target: !Sub "integrations/${SessionIntegration}"

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SessionApi
      RouteKey: $default
      Target: !Sub "integrations/${SessionIntegration}"

  SessionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SessionFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${SessionApi}/*"

  SessionDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn: [ConnectRoute, DisconnectRoute, DefaultRoute]
    Properties:
      ApiId: !Ref SessionApi

  SessionStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref SessionApi
      DeploymentId: !Ref SessionDeployment
      StageName: !Ref SessionStageName

Outputs:
  TelemetryTableName:
    Value: !Ref TelemetryTable
  PatientsTableName:
    Value: !Ref PatientsTable
  BiteQueueUrl:
    Value: !Ref BiteIngestQueue
  BiteDLQUrl:
    Value: !Ref BiteIngestDLQ
  IngestFunctionName:
    Value: !Ref IngestBiteFunction
  DeviceTopic:
    Value: !Sub "devices/${DeviceId}/bites"
  SessionUrl:
    Description: Connect here with ?patientId=<id> to watch a patient's bites live.
    Value: !Sub "wss://${SessionApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${SessionStageName}"
